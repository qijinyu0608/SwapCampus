services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: swapcampus
      MYSQL_USER: swapcampus
      MYSQL_PASSWORD: swapcampus
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data

  meilisearch:
    build:
      context: ./meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: swapcampus-meili-dev-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ./meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  supertokens-db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supertokens
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: supertokens
    ports:
      - "5433:5432"
    volumes:
      - ./supertokens-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertokens -d supertokens"]
      interval: 10s
      timeout: 5s
      retries: 12

  supertokens:
    image: supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://supertokens:supertokens@supertokens-db:5432/supertokens
    ports:
      - "3567:3567"
    depends_on:
      supertokens-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 12

  vendure:
    build:
      context: ./vendure
    restart: unless-stopped
    environment:
      APP_ENV: dev
      PORT: 3000
      VENDURE_DB_PATH: /app/data/vendure.sqlite
      COOKIE_SECRET: vendure-dev-cookie-secret
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: superadmin
    ports:
      - "3002:3000"
    volumes:
      - ./vendure-data:/app/data

  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      API_DOMAIN: ${API_DOMAIN:-http://127.0.0.1:3001}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-http://127.0.0.1:5178}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI:-http://supertokens:3567}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: swapcampus
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: swapcampus-meili-dev-key
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
      ENABLE_DEV_AUTH_FALLBACK: ${ENABLE_DEV_AUTH_FALLBACK:-true}
      VENDURE_ENABLED: ${VENDURE_ENABLED:-true}
      VENDURE_ADMIN_API_URL: ${VENDURE_ADMIN_API_URL:-http://vendure:3000/admin-api}
      VENDURE_ADMIN_USERNAME: ${VENDURE_ADMIN_USERNAME:-superadmin}
      VENDURE_ADMIN_PASSWORD: ${VENDURE_ADMIN_PASSWORD:-superadmin}
      VENDURE_ADMIN_TOKEN: ${VENDURE_ADMIN_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SEARCH_INDEX_OUTBOX_ENABLED: ${BACKEND_SEARCH_INDEX_OUTBOX_ENABLED:-false}
      SEARCH_INDEXER_INITIALIZE_ON_STARTUP: ${BACKEND_SEARCH_INDEXER_INITIALIZE_ON_STARTUP:-false}
      SEARCH_INDEX_OUTBOX_POLL_MS: ${SEARCH_INDEX_OUTBOX_POLL_MS:-3000}
      SEARCH_INDEX_OUTBOX_BATCH_SIZE: ${SEARCH_INDEX_OUTBOX_BATCH_SIZE:-20}
      SEARCH_INDEX_OUTBOX_PROCESSING_TIMEOUT_MS: ${SEARCH_INDEX_OUTBOX_PROCESSING_TIMEOUT_MS:-120000}
      SEARCH_INDEX_OUTBOX_RETRY_DELAYS_MS: ${SEARCH_INDEX_OUTBOX_RETRY_DELAYS_MS:-5000,15000,60000,300000,900000}
      COMMERCE_SYNC_ENABLED: ${BACKEND_COMMERCE_SYNC_ENABLED:-false}
      COMMERCE_SYNC_OUTBOX_POLL_MS: ${COMMERCE_SYNC_OUTBOX_POLL_MS:-3000}
      COMMERCE_SYNC_OUTBOX_BATCH_SIZE: ${COMMERCE_SYNC_OUTBOX_BATCH_SIZE:-20}
      COMMERCE_SYNC_OUTBOX_PROCESSING_TIMEOUT_MS: ${COMMERCE_SYNC_OUTBOX_PROCESSING_TIMEOUT_MS:-120000}
      COMMERCE_SYNC_OUTBOX_RETRY_DELAYS_MS: ${COMMERCE_SYNC_OUTBOX_RETRY_DELAYS_MS:-5000,15000,60000,300000,900000}
      MESSAGE_OUTBOX_ENABLED: ${BACKEND_MESSAGE_OUTBOX_ENABLED:-true}
      MESSAGE_OUTBOX_POLL_MS: ${MESSAGE_OUTBOX_POLL_MS:-2000}
      MESSAGE_OUTBOX_BATCH_SIZE: ${MESSAGE_OUTBOX_BATCH_SIZE:-20}
      MESSAGE_OUTBOX_PROCESSING_TIMEOUT_MS: ${MESSAGE_OUTBOX_PROCESSING_TIMEOUT_MS:-60000}
      MESSAGE_OUTBOX_RETRY_DELAYS_MS: ${MESSAGE_OUTBOX_RETRY_DELAYS_MS:-3000,10000,30000,120000}
      RECOMMENDATION_OUTBOX_ENABLED: ${BACKEND_RECOMMENDATION_OUTBOX_ENABLED:-true}
      RECOMMENDATION_OUTBOX_POLL_MS: ${RECOMMENDATION_OUTBOX_POLL_MS:-2000}
      RECOMMENDATION_OUTBOX_BATCH_SIZE: ${RECOMMENDATION_OUTBOX_BATCH_SIZE:-30}
      RECOMMENDATION_OUTBOX_PROCESSING_TIMEOUT_MS: ${RECOMMENDATION_OUTBOX_PROCESSING_TIMEOUT_MS:-60000}
      RECOMMENDATION_OUTBOX_RETRY_DELAYS_MS: ${RECOMMENDATION_OUTBOX_RETRY_DELAYS_MS:-3000,10000,30000,120000}
      GOVERNANCE_OUTBOX_ENABLED: ${BACKEND_GOVERNANCE_OUTBOX_ENABLED:-false}
      GOVERNANCE_OUTBOX_POLL_MS: ${GOVERNANCE_OUTBOX_POLL_MS:-2000}
      GOVERNANCE_OUTBOX_BATCH_SIZE: ${GOVERNANCE_OUTBOX_BATCH_SIZE:-20}
      GOVERNANCE_OUTBOX_PROCESSING_TIMEOUT_MS: ${GOVERNANCE_OUTBOX_PROCESSING_TIMEOUT_MS:-60000}
      GOVERNANCE_OUTBOX_RETRY_DELAYS_MS: ${GOVERNANCE_OUTBOX_RETRY_DELAYS_MS:-3000,10000,30000,120000}
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      meilisearch:
        condition: service_started
      supertokens:
        condition: service_healthy
      vendure:
        condition: service_started

  search-indexer:
    build:
      context: .
      dockerfile: ./search-indexer/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: swapcampus-meili-dev-key
      SEARCH_INDEX_OUTBOX_ENABLED: ${SEARCH_INDEX_OUTBOX_ENABLED:-true}
      SEARCH_INDEXER_INITIALIZE_ON_STARTUP: ${SEARCH_INDEXER_INITIALIZE_ON_STARTUP:-true}
      SEARCH_INDEX_OUTBOX_POLL_MS: ${SEARCH_INDEX_OUTBOX_POLL_MS:-3000}
      SEARCH_INDEX_OUTBOX_BATCH_SIZE: ${SEARCH_INDEX_OUTBOX_BATCH_SIZE:-20}
      SEARCH_INDEX_OUTBOX_PROCESSING_TIMEOUT_MS: ${SEARCH_INDEX_OUTBOX_PROCESSING_TIMEOUT_MS:-120000}
      SEARCH_INDEX_OUTBOX_RETRY_DELAYS_MS: ${SEARCH_INDEX_OUTBOX_RETRY_DELAYS_MS:-5000,15000,60000,300000,900000}
    depends_on:
      mysql:
        condition: service_healthy
      meilisearch:
        condition: service_started

  commerce-sync:
    build:
      context: .
      dockerfile: ./commerce-sync/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      VENDURE_ENABLED: ${VENDURE_ENABLED:-true}
      VENDURE_ADMIN_API_URL: ${VENDURE_ADMIN_API_URL:-http://vendure:3000/admin-api}
      VENDURE_ADMIN_USERNAME: ${VENDURE_ADMIN_USERNAME:-superadmin}
      VENDURE_ADMIN_PASSWORD: ${VENDURE_ADMIN_PASSWORD:-superadmin}
      VENDURE_ADMIN_TOKEN: ${VENDURE_ADMIN_TOKEN:-}
      COMMERCE_SYNC_ENABLED: ${COMMERCE_SYNC_ENABLED:-true}
      COMMERCE_SYNC_OUTBOX_POLL_MS: ${COMMERCE_SYNC_OUTBOX_POLL_MS:-3000}
      COMMERCE_SYNC_OUTBOX_BATCH_SIZE: ${COMMERCE_SYNC_OUTBOX_BATCH_SIZE:-20}
      COMMERCE_SYNC_OUTBOX_PROCESSING_TIMEOUT_MS: ${COMMERCE_SYNC_OUTBOX_PROCESSING_TIMEOUT_MS:-120000}
      COMMERCE_SYNC_OUTBOX_RETRY_DELAYS_MS: ${COMMERCE_SYNC_OUTBOX_RETRY_DELAYS_MS:-5000,15000,60000,300000,900000}
    depends_on:
      mysql:
        condition: service_healthy
      vendure:
        condition: service_started

  governance-worker:
    build:
      context: .
      dockerfile: ./governance-worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      GOVERNANCE_OUTBOX_ENABLED: ${GOVERNANCE_OUTBOX_ENABLED:-true}
      GOVERNANCE_OUTBOX_POLL_MS: ${GOVERNANCE_OUTBOX_POLL_MS:-2000}
      GOVERNANCE_OUTBOX_BATCH_SIZE: ${GOVERNANCE_OUTBOX_BATCH_SIZE:-20}
      GOVERNANCE_OUTBOX_PROCESSING_TIMEOUT_MS: ${GOVERNANCE_OUTBOX_PROCESSING_TIMEOUT_MS:-60000}
      GOVERNANCE_OUTBOX_RETRY_DELAYS_MS: ${GOVERNANCE_OUTBOX_RETRY_DELAYS_MS:-3000,10000,30000,120000}
    depends_on:
      mysql:
        condition: service_healthy

  db-init:
    profiles: ["init"]
    build:
      context: ./backend
      target: builder
    environment:
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      API_DOMAIN: ${API_DOMAIN:-http://127.0.0.1:3001}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-http://127.0.0.1:5178}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI:-http://supertokens:3567}
    command: sh -c "npm run db:push && npm run db:init"
    depends_on:
      mysql:
        condition: service_healthy
      supertokens:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:3001/api}
        VITE_API_DOMAIN: ${VITE_API_DOMAIN:-http://127.0.0.1:3001}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://127.0.0.1:3001}
        VITE_WEBSITE_DOMAIN: ${VITE_WEBSITE_DOMAIN:-http://127.0.0.1:5178}
    restart: unless-stopped
    ports:
      - "5178:80"
    volumes:
      - ./frontend/public/images:/usr/share/nginx/html/images:ro
    depends_on:
      - backend
