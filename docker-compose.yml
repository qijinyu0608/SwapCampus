services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: swapcampus
      MYSQL_USER: swapcampus
      MYSQL_PASSWORD: swapcampus
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      JWT_SECRET: swapcampus-dev-secret
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: swapcampus
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  db-init:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
    command: sh -c "npm run db:push && npm run db:init"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
        VITE_SOCKET_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "5178:80"
    depends_on:
      - backend
