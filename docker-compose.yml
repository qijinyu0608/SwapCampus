services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: swapcampus
      MYSQL_USER: swapcampus
      MYSQL_PASSWORD: swapcampus
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data

  meilisearch:
    build:
      context: ./meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: swapcampus-meili-dev-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ./meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  supertokens-db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supertokens
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: supertokens
    ports:
      - "5433:5432"
    volumes:
      - ./supertokens-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertokens -d supertokens"]
      interval: 10s
      timeout: 5s
      retries: 12

  supertokens:
    image: supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://supertokens:supertokens@supertokens-db:5432/supertokens
    ports:
      - "3567:3567"
    depends_on:
      supertokens-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 12

  vendure:
    build:
      context: ./vendure
    restart: unless-stopped
    environment:
      APP_ENV: dev
      PORT: 3000
      COOKIE_SECRET: vendure-dev-cookie-secret
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: superadmin
    ports:
      - "3002:3000"

  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      API_DOMAIN: ${API_DOMAIN:-http://127.0.0.1:3001}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-http://127.0.0.1:5178}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI:-http://supertokens:3567}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: swapcampus
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: swapcampus-meili-dev-key
      ENABLE_DEV_AUTH_FALLBACK: ${ENABLE_DEV_AUTH_FALLBACK:-true}
      VENDURE_ENABLED: ${VENDURE_ENABLED:-true}
      VENDURE_ADMIN_API_URL: ${VENDURE_ADMIN_API_URL:-http://vendure:3000/admin-api}
      VENDURE_ADMIN_USERNAME: ${VENDURE_ADMIN_USERNAME:-superadmin}
      VENDURE_ADMIN_PASSWORD: ${VENDURE_ADMIN_PASSWORD:-superadmin}
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      meilisearch:
        condition: service_started
      supertokens:
        condition: service_healthy
      vendure:
        condition: service_started

  db-init:
    profiles: ["init"]
    build:
      context: ./backend
      target: builder
    environment:
      DATABASE_URL: mysql://swapcampus:swapcampus@mysql:3306/swapcampus
      API_DOMAIN: ${API_DOMAIN:-http://127.0.0.1:3001}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-http://127.0.0.1:5178}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI:-http://supertokens:3567}
    command: sh -c "npm run db:push -- --force-reset && npm run db:init"
    depends_on:
      mysql:
        condition: service_healthy
      supertokens:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:3001/api}
        VITE_API_DOMAIN: ${VITE_API_DOMAIN:-http://127.0.0.1:3001}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://127.0.0.1:3001}
        VITE_WEBSITE_DOMAIN: ${VITE_WEBSITE_DOMAIN:-http://127.0.0.1:5178}
    restart: unless-stopped
    ports:
      - "5178:80"
    depends_on:
      - backend
